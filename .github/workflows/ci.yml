name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm backend:prisma:generate

      - name: Backend lint
        run: pnpm backend:lint

      - name: Backend typecheck
        run: pnpm backend:typecheck

      - name: Frontend typecheck
        run: pnpm frontend:typecheck

      - name: Backend tests
        run: pnpm backend:test

      - name: Frontend tests
        run: pnpm frontend:test

      - name: Backend build
        run: pnpm backend:build

      - name: Frontend build
        run: pnpm frontend:build
