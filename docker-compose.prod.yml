services:
  postgres:
    image: postgres:17-alpine
    env_file:
      - ./deploy/env/prod.env.example
      - path: ./deploy/env/prod.env
        required: false
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 512m

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./deploy/env/prod.env.example
      - path: ./deploy/env/prod.env
        required: false
    environment:
      - NODE_OPTIONS=--max-old-space-size=480
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./deploy/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 640m
    memswap_limit: 768m

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 192m

volumes:
  prod_postgres_data:
