services:
  postgres:
    image: postgres:17-alpine
    container_name: watermenu-postgres
    environment:
      POSTGRES_DB: watermenu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - watermenu
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d watermenu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

networks:
  watermenu:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
